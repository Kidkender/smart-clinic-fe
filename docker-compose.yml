services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sc-fe.rule=Host(`localhost`)"
      - "traefik.http.routers.sc-fe.entrypoints=websecure"
      - "traefik.http.routers.sc-fe.tls=true"
      - "traefik.http.services.sc-fe.loadbalancer.server.port=80"
    networks:
      - smart-clinic-net
networks:
  smart-clinic-net:
    external: true
